name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/auto-mlwfs/requirements.txt
      - run: python -m pip install -r skills/auto-mlwfs/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
